<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <link rel="stylesheet" href="styles.css">
</head>
    <body>
    <div class="container">

        <h1 class="title">JavaScript Playground</h1>

        <p class="welcome">
            Welcome to the JavaScript Playground!
        </p>

        <div class="counter">
            <h2>Counter</h2>
            <span id="count">0</span>
        </div>

        <div class="buttons">
            <button class="increment" onClick="Increment()">Increment</button>
            <button class="decrement" onClick="Decrement()">Decrement</button>
            <button class="reset" onClick="Reset()">Reset</button>
        </div>
        <div class="theme-buttons">
            <button class="light" >Light Mode</button>
            <button class="dark">Dark Mode</button>
        </div>
    <script src="script.js"></script>
    </div>
    </body>
</html>
