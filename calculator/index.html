<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Calculator</h1>
        <label for="input">Expression:</label>
        <input class="input" id="input" readonly />
        <h2 class="result">Result : <span class="value" id ="count">0</span></h2>
        <button class="clear" onclick="clearDisplay()">CLEAR</button>
        <div class="buttons">
            <button class="number" onClick = "appendValue(this.textContent)">1</button>
            <button class="number"  onClick = "appendValue(this.textContent)">2</button>
            <button class="number"  onClick = "appendValue(this.textContent)">3</button>
            <button class="operator" onClick = "appendValue(this.textContent)">+</button>
            <button class="number"  onClick = "appendValue(this.textContent)">4</button>
            <button class="number"  onClick = "appendValue(this.textContent)">5</button>
            <button class="number"  onClick = "appendValue(this.textContent)">6</button>
            <button class="operator"  onClick = "appendValue(this.textContent)">-</button>
            <button class="number" onClick = "appendValue(this.textContent)">7 </button>
            <button class="number"  onClick = "appendValue(this.textContent)">8</button>
            <button class="number" onClick = "appendValue(this.textContent)" >9</button>
            <button class="operator" onClick = "appendValue(this.textContent)">*</button>
            <button class="number" onClick = "appendValue(this.textContent)">0</button>
            <button class="operator" onClick = "appendValue(this.textContent)">/</button>
            <button class="operator" onClick = "result()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
